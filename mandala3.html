<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistem Pengelolaan Antrean Aplikasi</title>
<style>
:root{--p:#5b47c9;--pd:#3f2fa3;--bg:#f3f1ff;--ink:#1f1b3a;--mut:#6b6788;--ln:#e4e0f5}
*{box-sizing:border-box}body{margin:0;font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:#fff;border-bottom:1px solid var(--ln);padding:10px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header b{font-size:16px;flex:1;min-width:220px}select,input,textarea{font:inherit;border:1px solid #cfc9ea;border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);width:100%}
header select{width:auto}textarea{min-height:72px}
main{max-width:1120px;margin:0 auto;padding:24px}h1{margin:0 0 4px;font-size:24px}.sub{color:var(--mut);margin:0 0 18px}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:20px;margin-bottom:16px}
.btn{border:1px solid var(--p);background:#fff;color:var(--p);border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--p);color:#fff}.btn.red{border-color:#d9534f;color:#b3261e}.btn.sm{padding:5px 11px;font-size:13px}.btn:hover{filter:brightness(.95)}
.ic{position:relative;border:0;background:none;font-size:20px;cursor:pointer}.ic i{position:absolute;top:-4px;right:-6px;background:#d9304f;color:#fff;border-radius:9px;font:700 11px sans-serif;padding:1px 5px;font-style:normal}
.chip{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600}.av{width:32px;height:32px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mut);text-align:left;background:#f7f5ff}th,td{padding:12px;border-bottom:1px solid var(--ln);vertical-align:middle}
tr.dr{cursor:grab}tr.over td{background:#ece8ff}
.pill{display:inline-block;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.gr{background:#e5e7eb;color:#374151}.y{background:#fde9a8;color:#7a4b00}.r{background:#fdd3d3;color:#8a1c1c}.g{background:#c9f0d6;color:#14532d}.b{background:#cfe3ff;color:#1d4ed8}.p{background:#e0d7ff;color:#3f2fa3}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}.tile{border-radius:16px;padding:16px}.tile b{font-size:30px;display:block}
.row{display:flex;gap:14px;flex-wrap:wrap}.row>*{flex:1;min-width:230px}label{font-weight:600;font-size:13px;display:block;margin:10px 0 4px}
.warn{background:#fdecec;border:1px solid #f4b8b8;border-radius:12px;padding:14px;margin-bottom:14px}.ok{background:#e8f8ee;border:1px solid #b6e3c6;border-radius:12px;padding:12px}
.f{display:block;font-size:13px;color:var(--p);margin:3px 0;cursor:pointer;text-decoration:underline}.mut{color:var(--mut)}
.nt{display:flex;gap:14px;padding:16px;border:1px solid var(--ln);border-radius:14px;margin-bottom:10px;background:#fff;cursor:pointer}.nt.un{background:#efeaff}.nt .ni{font-size:22px}.nt div{flex:1}.dot{width:9px;height:9px;border-radius:50%;background:var(--p);align-self:center}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs .btn.on{background:var(--p);color:#fff}
.bar{height:10px;border-radius:6px;background:#e4e0f5;min-width:90px}.bar i{display:block;height:100%;border-radius:6px;background:var(--p)}
.hi{background:#fff4c9}.err{color:#b3261e;font-weight:600;margin:8px 0}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1f1b3a;color:#fff;padding:11px 20px;border-radius:12px;display:none;z-index:9}
@media(max-width:700px){main{padding:14px}.tw{overflow-x:auto}}
</style></head><body>
<header><b>Sistem Pengelolaan Antrean Aplikasi · Divisi IT Universitas Mandala</b>
<select id="role" onchange="setRole(this.value)"><option value="client">Masuk sebagai: Client</option><option value="analyst">Masuk sebagai: Tim Analis</option><option value="leader">Masuk sebagai: Leader</option></select>
<button class="ic" onclick="go('notif')" title="Notifikasi">🔔<i id="bd"></i></button>
<div class="chip" onclick="go('profile')"><span class="av" id="av"></span><span id="un"></span></div>
<button class="btn sm" onclick="resetDemo()">Reset data demo</button></header>
<main id="app"></main><div id="toast"></div>
<script>
const KEY='mandala-antrean-v2';
const FIELDS=[['name','Nama aplikasi'],['unit','Unit pengusul'],['pic','Nama PIC'],['contact','Kontak PIC'],['purpose','Tujuan aplikasi'],['audience','Calon pengguna'],['deadline','Deadline','date'],['desc','Deskripsi aplikasi','ta']];
const PC={'Draft':'gr','Menunggu Review':'y','Perlu Revisi':'r','Siap Dikerjakan':'g','Sedang Dikerjakan':'b','Selesai by Programmer':'p'};
const ASP=[['a','Kelengkapan pengajuan'],['b','Kejelasan kebutuhan aplikasi'],['c','Kejelasan proses bisnis']];
const W={High:3,Medium:2,Low:1};
const PROGS=['Rani','Budi','Sari'];
const ROLES={client:{n:'Client (Fakultas)',j:'Pemohon',u:'client01',e:'client@mandala.ac.id',a:'C'},analyst:{n:'Tim Analis',j:'Analis Sistem',u:'analis01',e:'analis@mandalait.id',a:'A'},leader:{n:'Leader Divisi IT',j:'Kepala Tim',u:'leader01',e:'leader@mandalait.id',a:'L'}};
const day=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
function seed(){const base={pic:'Bu Rina',contact:'0812-3456-7890',audience:'Staf & mahasiswa',desc:'Aplikasi untuk membantu proses kerja unit.',files:{letter:'surat-permohonan.pdf',process:'alur-proses.png',support:[]},hist:[],order:0};
const R=(o)=>Object.assign(JSON.parse(JSON.stringify(base)),o);
return{reqs:[
R({id:1,name:'Sistem Informasi Akademik',unit:'Fakultas Teknik',purpose:'Mengelola data akademik',deadline:day(90),status:'Menunggu Review',date:day(-5),ver:1}),
R({id:2,name:'Peminjaman Ruang Kelas',unit:'BAA',pic:'Bu Rina',purpose:'Mendukung proses layanan unit',deadline:day(60),status:'Perlu Revisi',date:day(-9),ver:1,files:{letter:'surat-permohonan.pdf',process:'alur-lama.png',support:[]},review:{flags:{a:true,b:true,c:false},notes:'Alur persetujuan peminjaman belum tergambar jelas pada lampiran proses bisnis. Mohon lengkapi peran pihak yang menyetujui.',annot:['alur-lama-anotasi.pdf']}}),
R({id:3,name:'Portal Alumni',unit:'Kemahasiswaan',purpose:'Menghubungkan alumni',deadline:day(120),status:'Draft',date:day(-2),ver:1,files:{letter:'',process:'',support:[]}}),
R({id:4,name:'Surat Keterangan Aktif',unit:'BAA',purpose:'Otomasi surat mahasiswa',deadline:day(45),status:'Siap Dikerjakan',date:day(-14),ver:1,rec:'High',urg:'Medium',order:1}),
R({id:5,name:'E-Absensi Dosen',unit:'SDM',purpose:'Presensi dosen',deadline:day(75),status:'Siap Dikerjakan',date:day(-12),ver:1,rec:'Medium',urg:'Medium',order:2}),
R({id:6,name:'Sistem Inventaris',unit:'Keuangan',purpose:'Mengelola aset',deadline:day(10),status:'Sedang Dikerjakan',date:day(-30),ver:1,urg:'High',progress:40,team:[{n:'Budi',pc:1},{n:'Rani',pc:0}]}),
R({id:7,name:'Layanan Magang',unit:'Fakultas Ekonomi',purpose:'Pendaftaran magang',deadline:day(50),status:'Menunggu Review',date:day(-3),ver:2,desc:'Aplikasi pendaftaran dan pemantauan magang.',files:{letter:'surat-permohonan.pdf',process:'alur-v2.png',support:['panduan.pdf']},hist:[{v:1,f:{name:'Layanan Magang',unit:'Fakultas Ekonomi',pic:'Bu Rina',contact:'0812-3456-7890',purpose:'Pendaftaran magang',audience:'Staf & mahasiswa',deadline:day(50),desc:'Aplikasi pendaftaran magang.'},files:{letter:'surat-permohonan.pdf',process:'alur-v1.png',support:[]}}]})],
n:{client:[{id:1,t:'Pengajuan',h:'Pengajuan Anda Perlu Revisi',x:'Pengajuan “Peminjaman Ruang Kelas” perlu direvisi. Silakan cek catatan revisi pada menu Pengajuan Saya.',w:'Kemarin, 15:30',un:1},{id:2,t:'Sistem',h:'Informasi Sistem',x:'Pemeliharaan sistem akan dilakukan pada 12 Desember 2026 pukul 21.00 – 23.00 WIB.',w:'10 Nov 2026',un:0}],analyst:[{id:3,t:'Pengajuan',h:'Pengajuan baru masuk',x:'“Layanan Magang” diajukan ulang oleh Client.',w:'Hari ini, 09:10',un:1}],leader:[]}}}
let D,S={role:'client',view:'list',id:null},F={};
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!D)D=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=id=>D.reqs.find(r=>r.id==id),pill=s=>`<span class="pill ${PC[s]}">${s}</span>`;
const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)};
function go(v,id){S.view=v;S.id=id??null;render();scrollTo(0,0)}
function setRole(r){S.role=r;S.view=r=='client'?'list':r=='analyst'?'dash':'queue';S.id=null;render()}
function resetDemo(){D=seed();save();setRole(S.role);toast('Data demo direset')}
function notify(role,t,h,x){D.n[role].unshift({id:Date.now(),t,h,x,w:'Baru saja',un:1})}
const dl=d=>Math.ceil((new Date(d)-new Date(new Date().toDateString()))/864e5);
const fmt=d=>new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
function render(){const m=ROLES[S.role];$('role').value=S.role;$('un').textContent=m.n;$('av').textContent=m.a;const u=D.n[S.role].filter(n=>n.un).length;$('bd').textContent=u;$('bd').style.display=u?'':'none';
const V={client:{list:vList,form:vForm,detail:vDetail,revise:vForm,notif:vNotif,profile:vProfile},analyst:{dash:vDash,review:vReview,notif:vNotif,profile:vProfile},leader:{queue:vQueue,assign:vAssign,monitor:vMonitor,notif:vNotif,profile:vProfile}};
$('app').innerHTML=(S.role=='leader'&&!['notif','profile'].includes(S.view)?`<div class="tabs"><button class="btn ${S.view=='queue'?'on':''}" onclick="go('queue')">Antrean</button><button class="btn ${S.view=='monitor'?'on':''}" onclick="go('monitor')">Monitoring</button></div>`:'')+(V[S.role][S.view]||vNotif)();save()}
/* CLIENT */
function rowsC(){const q=(F.q||'').toLowerCase();return D.reqs.filter(r=>(!F.s||r.status==F.s)&&(!F.p||(r.urg||r.rec)==F.p)&&(r.name+r.unit).toLowerCase().includes(q)).map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b><br><span class="mut">${esc(r.unit)}</span></td><td>${fmt(r.date)}</td><td>${r.urg||r.rec?`<span class="pill ${(r.urg||r.rec)=='High'?'r':'y'}">${r.urg||r.rec}</span>`:'<span class="mut">–</span>'}</td><td>${pill(r.status)}</td><td><button class="btn sm" onclick="go('detail',${r.id})">Lihat</button> ${r.status=='Draft'?`<button class="btn sm pri" onclick="go('form',${r.id})">Lanjutkan</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">Tidak ada pengajuan.</td></tr>'}
function flt(k,v){F[k]=v;$('tb').innerHTML=rowsC()}
function vList(){return`<h1>Pengajuan Saya</h1><p class="sub">Berikut adalah daftar pengajuan aplikasi.</p><div class="card"><div class="row" style="margin-bottom:14px"><input placeholder="Cari nama aplikasi atau unit..." value="${esc(F.q)}" oninput="flt('q',this.value)"><select onchange="flt('s',this.value)"><option value="">Filter Status</option>${Object.keys(PC).map(s=>`<option>${s}</option>`)}</select><select onchange="flt('p',this.value)"><option value="">Filter Prioritas</option><option>High</option><option>Medium</option><option>Low</option></select><button class="btn pri" style="flex:0 0 auto" onclick="go('form',0)">+ Ajukan Aplikasi</button></div><div class="tw"><table><tr><th>NO</th><th>NAMA APLIKASI &amp; UNIT</th><th>TANGGAL</th><th>PRIORITAS</th><th>STATUS</th><th>AKSI</th></tr><tbody id="tb">${rowsC()}</tbody></table></div></div>`}
const files=a=>(a&&a.length?a:[]).map(n=>`<span class="f" onclick="toast('Pratinjau demo: ${esc(n)}')">📎 ${esc(n)}</span>`).join('')||'<span class="mut">–</span>';
function vForm(){const rev=S.view=='revise',r=S.id?R(S.id):{files:{letter:'',process:'',support:[]},review:null};
const side=rev&&r.review?`<div class="card" style="flex:0 0 340px;align-self:flex-start"><h3 style="margin-top:0">Catatan Tim Analis</h3>${ASP.map(([k,l])=>`<div>${r.review.flags[k]?'✅':'❌'} ${l}</div>`).join('')}<p class="warn" style="margin-top:12px">${esc(r.review.notes)}</p><b>Dokumen anotasi Analis</b><br>${files(r.review.annot)}<p class="mut" style="font-size:12px">Buka dokumen anotasi, lalu perbaiki bagian yang ditandai pada form di samping.</p>${r.hist.length?`<b>Riwayat pengajuan</b><br>${r.hist.map(h=>`<div class="mut">Pengajuan ke-${h.v}: ${h.f.name}</div>`).join('')}`:''}</div>`:'';
return`<h1>${rev?'Perbaiki / Lengkapi Permintaan':r.id?'Lanjutkan Draf':'Ajukan Aplikasi Baru'}</h1><p class="sub">${rev?'Perbaiki sesuai catatan Analis, lalu kirim ulang.':'Isi data, unggah dokumen wajib, lalu kirim atau simpan sebagai draf.'}</p><div class="row" style="align-items:flex-start"><div class="card" style="flex:2;min-width:300px"><div id="er"></div>${FIELDS.map(([k,l,t])=>`<label>${l} *</label>${t=='ta'?`<textarea id="f_${k}">${esc(r[k])}</textarea>`:`<input id="f_${k}" type="${t||'text'}" value="${esc(r[k])}">`}`).join('')}
<label>Surat permohonan resmi * <span class="mut">${esc(r.files.letter)}</span></label><input type="file" id="f_letter"><label>Lampiran proses bisnis utama * <span class="mut">${esc(r.files.process)}</span></label><input type="file" id="f_process"><label>Lampiran pendukung (opsional, boleh lebih dari 1) <span class="mut">${esc(r.files.support.join(', '))}</span></label><input type="file" id="f_support" multiple>
<div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="saveReq(${r.id||0},false)">${rev?'Simpan Perubahan':'Simpan Draf'}</button><button class="btn pri" onclick="saveReq(${r.id||0},true)">${rev?'Kirim Ulang':'Kirim Permintaan'}</button><button class="btn" onclick="go('list')">Batal</button></div></div>${side}</div>`}
function saveReq(id,send){let r=id?R(id):null,d={};FIELDS.forEach(([k])=>d[k]=$('f_'+k).value.trim());
const fn=k=>{const f=$('f_'+k).files;return[...f].map(x=>x.name)};const L=fn('letter')[0],P=fn('process')[0],Sp=fn('support');
if(!r){r={id:Date.now(),status:'Draft',date:day(0),ver:1,hist:[],files:{letter:'',process:'',support:[]},order:0};D.reqs.push(r)}
const old={f:Object.fromEntries(FIELDS.map(([k])=>[k,r[k]])),files:JSON.parse(JSON.stringify(r.files))};
const nf={letter:L||r.files.letter,process:P||r.files.process,support:r.files.support.concat(Sp)};
if(send){const miss=FIELDS.filter(([k])=>!d[k]).map(x=>x[1]);if(!nf.letter)miss.push('Surat permohonan');if(!nf.process)miss.push('Lampiran proses bisnis');if(miss.length){if(!id)D.reqs.pop();$('er').innerHTML=`<div class="err">Belum bisa dikirim, lengkapi: ${miss.join(', ')}</div>`;return}}
if(!r.name&&!d.name){D.reqs=D.reqs.filter(x=>x!==r);$('er').innerHTML='<div class="err">Nama aplikasi wajib diisi.</div>';return}
if(send&&r.status=='Perlu Revisi'){r.hist.push({v:r.ver,f:old.f,files:old.files});r.ver++;notify('analyst','Pengajuan','Pengajuan diajukan ulang',`“${d.name}” diajukan ulang oleh Client.`)}
else if(send)notify('analyst','Pengajuan','Pengajuan baru masuk',`“${d.name}” menunggu review.`);
Object.assign(r,d,{files:nf});if(send){r.status='Menunggu Review';toast('Permintaan dikirim. Status: Menunggu Review')}else toast('Tersimpan');go('list')}
function vDetail(){const r=R(S.id);const stp=['Draft','Menunggu Review',r.status=='Perlu Revisi'?'Perlu Revisi':'Siap Dikerjakan','Sedang Dikerjakan','Selesai by Programmer'],at=stp.indexOf(r.status);
return`<a href="#" onclick="go('list');return false">← Kembali</a><div class="card" style="margin-top:10px"><h1>${esc(r.name)} ${pill(r.status)}</h1><p class="sub">Pengajuan ke-${r.ver}</p><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">${stp.map((s,i)=>`<span class="pill ${i<=at?PC[s]:'gr'}" style="opacity:${i<=at?1:.45}">${i+1}. ${s}</span>`).join('')}</div>
${r.status=='Perlu Revisi'&&r.review?`<div class="warn"><b>Catatan Tim Analis:</b><br>${esc(r.review.notes)}<div style="margin:8px 0">Aspek yang perlu diperbaiki: ${ASP.filter(([k])=>!r.review.flags[k]).map(a=>`<span class="pill r">${a[1]}</span>`).join(' ')}</div><b>Dokumen anotasi:</b> ${files(r.review.annot)}<div style="margin-top:12px"><button class="btn pri" onclick="go('revise',${r.id})">Perbaiki / Lengkapi</button></div></div>`:''}
${r.status=='Siap Dikerjakan'?'<div class="ok">Permintaan Anda siap dan masuk antrean pengerjaan. Isi permintaan tidak dapat diubah lagi.</div>':''}
<table>${FIELDS.map(([k,l])=>`<tr><th style="width:200px">${l}</th><td>${esc(r[k])}</td></tr>`).join('')}<tr><th>Surat permohonan</th><td>${files([r.files.letter].filter(Boolean))}</td></tr><tr><th>Proses bisnis</th><td>${files([r.files.process].filter(Boolean))}</td></tr><tr><th>Lampiran pendukung</th><td>${files(r.files.support)}</td></tr></table></div>`}
/* NOTIF & PROFIL */
function vNotif(){const L=D.n[S.role],t=F.nt||'Semua',sh=L.filter(n=>t=='Semua'||n.t==t);const c=k=>L.filter(n=>k=='Semua'||n.t==k).length;
return`<h1>🔔 Notifikasi</h1><p class="sub">Informasi terbaru seputar pengajuan Anda</p><div class="tabs">${['Semua','Pengajuan','Sistem'].map(k=>`<button class="btn ${t==k?'on':''}" onclick="F.nt='${k}';render()">${k} (${c(k)})</button>`).join('')}<button class="btn sm" style="margin-left:auto" onclick="D.n[S.role].forEach(n=>n.un=0);render()">Tandai semua dibaca</button></div>${sh.map(n=>`<div class="nt ${n.un?'un':''}" onclick="readN(${n.id})"><span class="ni">${n.t=='Sistem'?'ℹ️':'🔄'}</span><div><b>${esc(n.h)}</b><br>${esc(n.x)}</div><span class="mut">${esc(n.w)}</span>${n.un?'<span class="dot"></span>':''}</div>`).join('')||'<p class="mut">Tidak ada notifikasi.</p>'}`}
function readN(id){const n=D.n[S.role].find(x=>x.id==id);if(n)n.un=0;render()}
function vProfile(){const m=ROLES[S.role];return`<h1>Profil Pengguna</h1><p class="sub">Kelola informasi akun Anda.</p><div class="row"><div class="card"><div class="av" style="width:90px;height:90px;font-size:34px;margin-bottom:14px">${m.a}</div><button class="btn sm pri" onclick="toast('Ubah foto: fitur demo')">Ubah Foto</button></div><div class="card" style="flex:2"><h3 style="margin-top:0">Informasi Akun</h3><table><tr><th>Nama Lengkap</th><td>${m.n}</td></tr><tr><th>Jabatan</th><td>${m.j}</td></tr><tr><th>Username</th><td>${m.u}</td></tr><tr><th>Email</th><td>${m.e}</td></tr></table></div><div class="card"><h3 style="margin-top:0">Pengaturan Akun</h3><button class="btn" style="width:100%;margin-bottom:10px" onclick="const v=prompt('Nama lengkap baru:',ROLES[S.role].n);if(v){ROLES[S.role].n=v;render()}">Ubah Profil</button><button class="btn" style="width:100%;margin-bottom:10px" onclick="toast('Ubah password: fitur demo')">Ubah Password</button><button class="btn red" style="width:100%" onclick="toast('Logout: fitur demo')">Logout</button></div></div>`}
/* ANALIS */
function vDash(){const c=s=>D.reqs.filter(r=>r.status==s).length,T=[['Total Pengajuan',D.reqs.length,'#e6e2ff'],['Menunggu Review',c('Menunggu Review'),'#fdf0c8'],['Perlu Revisi',c('Perlu Revisi'),'#fde0e0'],['Siap Dikerjakan',c('Siap Dikerjakan'),'#d9f4e3'],['Sedang Dikerjakan',c('Sedang Dikerjakan'),'#d6e7ff']];
return`<h1>Halo, Tim Analis 👋</h1><p class="sub">Berikut ringkasan kondisi antrean pengajuan aplikasi hari ini.</p><div class="tiles">${T.map(t=>`<div class="tile" style="background:${t[2]}">${t[0]}<b>${t[1]}</b></div>`).join('')}</div><div class="card"><h3 style="margin-top:0">Permintaan Menunggu Review</h3><div class="tw"><table><tr><th>Aplikasi</th><th>Unit</th><th>Deadline</th><th>Pengajuan ke</th><th></th></tr>${D.reqs.filter(r=>r.status=='Menunggu Review').map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.unit)}</td><td>${fmt(r.deadline)}</td><td>${r.ver}${r.ver>1?' <span class="pill y">Diajukan ulang</span>':''}</td><td><button class="btn sm pri" onclick="go('review',${r.id})">Review</button></td></tr>`).join('')||'<tr><td colspan="5" class="mut">Tidak ada permintaan.</td></tr>'}</table></div></div>`}
function vReview(){const r=R(S.id),h=r.hist[r.hist.length-1];
const cmp=h?`<div class="card"><h3 style="margin-top:0">Perbandingan Pengajuan ke-${h.v} vs ke-${r.ver}</h3><table><tr><th>Field</th><th>Sebelumnya</th><th>Terbaru</th></tr>${FIELDS.map(([k,l])=>`<tr class="${h.f[k]!=r[k]?'hi':''}"><td>${l}</td><td>${esc(h.f[k])}</td><td>${esc(r[k])}</td></tr>`).join('')}${[['Proses bisnis',h.files.process,r.files.process],['Pendukung',h.files.support.join(', '),r.files.support.join(', ')]].map(x=>`<tr class="${x[1]!=x[2]?'hi':''}"><td>${x[0]}</td><td>${esc(x[1])||'–'}</td><td>${esc(x[2])||'–'}</td></tr>`).join('')}</table></div>`:'';
return`<a href="#" onclick="go('dash');return false">← Kembali</a><div class="card" style="margin-top:10px"><h1>${esc(r.name)} ${pill(r.status)}</h1><table>${FIELDS.map(([k,l])=>`<tr><th style="width:200px">${l}</th><td>${esc(r[k])}</td></tr>`).join('')}<tr><th>Surat permohonan</th><td>${files([r.files.letter])}</td></tr><tr><th>Proses bisnis</th><td>${files([r.files.process])}</td></tr><tr><th>Lampiran pendukung</th><td>${files(r.files.support)}</td></tr></table></div>${cmp}
<div class="card"><h3 style="margin-top:0">Penilaian Kesiapan</h3><div id="er"></div>${ASP.map(([k,l])=>`<label style="font-weight:400"><input type="checkbox" id="a_${k}" checked style="width:auto"> ${l} terpenuhi</label>`).join('')}<label>Catatan perbaikan untuk Client (wajib bila dikembalikan)</label><textarea id="a_notes"></textarea><label>Dokumen anotasi (opsional, boleh lebih dari 1)</label><input type="file" id="a_annot" multiple><label>Rekomendasi urgensi (bila siap)</label><select id="a_rec" style="max-width:200px"><option>High</option><option selected>Medium</option><option>Low</option></select><div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" onclick="decide(${r.id},1)">Nyatakan Siap Dikerjakan</button><button class="btn red" onclick="decide(${r.id},0)">Kembalikan (Perlu Revisi)</button></div></div>`}
function decide(id,ready){const r=R(id),fl={};ASP.forEach(([k])=>fl[k]=$('a_'+k).checked);const all=Object.values(fl).every(Boolean),notes=$('a_notes').value.trim();
if(ready){if(!all){$('er').innerHTML='<div class="err">Siap hanya bisa dinyatakan jika semua aspek terpenuhi.</div>';return}
r.status='Siap Dikerjakan';r.rec=r.urg=$('a_rec').value;r.order=Math.max(0,...D.reqs.map(x=>x.order||0))+1;notify('client','Pengajuan','Pengajuan Anda Disetujui',`Pengajuan “${r.name}” telah disetujui oleh Tim Analis dan masuk antrean.`);toast('Siap Dikerjakan: masuk antrean paling bawah')}
else{if(all||!notes){$('er').innerHTML='<div class="err">Untuk mengembalikan: hilangkan centang minimal satu aspek dan isi catatan perbaikan.</div>';return}
r.status='Perlu Revisi';r.review={flags:fl,notes,annot:[...$('a_annot').files].map(f=>f.name)};notify('client','Pengajuan','Pengajuan Anda Perlu Revisi',`Pengajuan “${r.name}” perlu direvisi. Silakan cek catatan revisi pada menu Pengajuan Saya.`);toast('Dikembalikan ke Client (Perlu Revisi)')}go('dash')}
/* LEADER */
function load(n){const a=D.reqs.filter(r=>r.status=='Sedang Dikerjakan'&&r.team.some(t=>t.n==n)),s=a.reduce((x,r)=>x+W[r.urg||'Medium']*(1+(100-r.progress)/100)+(dl(r.deadline)<0?3:dl(r.deadline)<=7?2:dl(r.deadline)<=14?1:0),0);return{a,s:+s.toFixed(1),l:s<4?['Ringan','g']:s<8?['Sedang','y']:['Berat','r']}}
const Q=()=>D.reqs.filter(r=>r.status=='Siap Dikerjakan').sort((a,b)=>a.order-b.order);
function vQueue(){return`<h1>Antrean Siap Dikerjakan</h1><p class="sub">Seret baris untuk mengubah urutan. Atur urgensi pada baris yang sama.</p><div class="card tw"><table><tr><th>#</th><th>Aplikasi</th><th>Tujuan</th><th>Deadline</th><th>Masuk antrean</th><th>Rek. Analis</th><th>Urgensi</th><th></th></tr>${Q().map((r,i)=>`<tr class="dr" draggable="true" data-id="${r.id}" ondragstart="DR=${r.id}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="drop(${r.id})"><td>☰ ${i+1}</td><td><b>${esc(r.name)}</b><br><span class="mut">${esc(r.unit)}</span></td><td>${esc(r.purpose)}</td><td>${fmt(r.deadline)}</td><td>${fmt(r.date)}</td><td>${r.rec||'–'}</td><td><select onchange="R(${r.id}).urg=this.value;save()">${['High','Medium','Low'].map(u=>`<option ${r.urg==u?'selected':''}>${u}</option>`)}</select></td><td><button class="btn sm pri" onclick="go('assign',${r.id})">Assign</button></td></tr>`).join('')||'<tr><td colspan="8" class="mut">Antrean kosong.</td></tr>'}</table></div>`}
let DR=0;function drop(id){const q=Q(),a=q.findIndex(r=>r.id==DR),b=q.findIndex(r=>r.id==id);if(a<0||a==b)return render();const[x]=q.splice(a,1);q.splice(b,0,x);q.forEach((r,i)=>r.order=i+1);render()}
function vAssign(){const r=R(S.id);return`<a href="#" onclick="go('queue');return false">← Kembali</a><div class="card" style="margin-top:10px"><h1>Assign Programmer: ${esc(r.name)}</h1><p class="sub">Lihat beban programmer sebelum memilih.</p><div id="er"></div><table><tr><th>Pilih</th><th>Programmer</th><th>Beban</th><th>Skor</th><th>Aplikasi aktif</th><th>Project Coordinator</th></tr>${PROGS.map(n=>{const o=load(n);return`<tr><td><input type="checkbox" class="pk" value="${n}" style="width:auto"></td><td>${n}</td><td><span class="pill ${o.l[1]}">${o.l[0]}</span></td><td>${o.s}</td><td>${o.a.map(x=>esc(x.name)).join(', ')||'–'}</td><td><input type="radio" name="pc" value="${n}" style="width:auto"></td></tr>`}).join('')}</table><p class="mut">Bila lebih dari satu programmer dipilih, tentukan satu Project Coordinator.</p><button class="btn pri" onclick="doAssign(${r.id})">Simpan</button></div>`}
function doAssign(id){const r=R(id),p=[...document.querySelectorAll('.pk:checked')].map(x=>x.value),pc=(document.querySelector('[name=pc]:checked')||{}).value;
if(!p.length)return $('er').innerHTML='<div class="err">Pilih minimal satu programmer.</div>';if(p.length>1&&!(pc&&p.includes(pc)))return $('er').innerHTML='<div class="err">Tentukan Project Coordinator dari programmer terpilih.</div>';
r.team=p.map(n=>({n,pc:p.length>1&&n==pc?1:0}));r.status='Sedang Dikerjakan';r.progress=0;toast('Ditugaskan. Status: Sedang Dikerjakan');go('monitor')}
function vMonitor(){return`<h1>Monitoring Pengerjaan</h1><p class="sub">Aplikasi yang mendekati atau melewati deadline disorot.</p><div class="card tw"><table><tr><th>Aplikasi</th><th>Tim</th><th>Progress</th><th>Deadline</th><th>Peringatan</th></tr>${D.reqs.filter(r=>r.status=='Sedang Dikerjakan').map(r=>{const d=dl(r.deadline);return`<tr class="${d<=7?'hi':''}"><td><b>${esc(r.name)}</b></td><td>${r.team.map(t=>t.n+(t.pc?' (PC)':'')).join(', ')}</td><td><div class="bar"><i style="width:${r.progress}%"></i></div>${r.progress}%</td><td>${fmt(r.deadline)}</td><td>${d<0?'<span class="pill r">Lewat deadline</span>':d<=14?`<span class="pill y">${d} hari lagi</span>`:'–'}</td></tr>`}).join('')||'<tr><td colspan="5" class="mut">Belum ada aplikasi yang dikerjakan.</td></tr>'}</table></div>`}
render();
</script></body></html>
