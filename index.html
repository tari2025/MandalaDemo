<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Utama Prototype - APTA GROUP</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h1 {
        color: #111827;
        margin-bottom: 10px;
      }
      p {
        color: #6b7280;
        margin-bottom: 30px;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      a {
        text-decoration: none;
        padding: 15px 30px;
        background: #4f46e5;
        color: white;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.2s;
      }
      a:hover {
        background: #4338ca;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Prototype Sistem Antrean Mandala IT</h1>
      <p>Silakan pilih halaman yang ingin dilihat:</p>
      <div class="links">
        <a href="mandala1.html">Buka Halaman 1</a>
        <a href="mandala2.html">Buka Halaman 2</a>
        <a href="mandala3.html">Buka Halaman 3 (Versi Interaktif)</a>
      </div>
    </div>
  </body>
</html>
